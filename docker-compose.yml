services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-portal}
      POSTGRES_USER: ${POSTGRES_USER:-portal}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - portal-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD}
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD}"]
    volumes:
      - portal-redis:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $$REDIS_PASSWORD ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 12

  migrate:
    build: .
    env_file: .env
    environment:
      # The bundled database is an internal staging profile; production uses an external TLS-verified PostgreSQL.
      NODE_ENV: staging
      MAX_TRANSPORT: webhook
      DATABASE_URL: postgresql://${POSTGRES_USER:-portal}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-portal}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
    depends_on:
      postgres:
        condition: service_healthy
    command: ["node", "dist/entrypoints/db-migrate.js"]

  app:
    build: .
    env_file: .env
    environment:
      # The bundled database is an internal staging profile; production uses an external TLS-verified PostgreSQL.
      NODE_ENV: staging
      MAX_TRANSPORT: webhook
      APP_PORT: 8787
      DATABASE_URL: postgresql://${POSTGRES_USER:-portal}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-portal}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    expose:
      - "8787"
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD", "node", "-e", "require('node:http').get('http://127.0.0.1:8787/health/live', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12

  bot:
    build: .
    env_file: .env
    environment:
      # The MAX Webhook adapter is a separate single-replica process; production uses a trusted TLS edge in front of port 3000.
      NODE_ENV: staging
      MAX_TRANSPORT: webhook
      WEBHOOK_PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-portal}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-portal}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    expose:
      - "3000"
    read_only: true
    tmpfs:
      - /tmp
    command: ["node", "dist/bot.js"]
    healthcheck:
      test: ["CMD", "node", "-e", "require('node:net').connect(3000, '127.0.0.1', () => process.exit(0)).on('error', () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  portal-postgres:
  portal-redis:
