services:
  postgres:
    image: postgres:17-alpine
    ports:
      - "127.0.0.1:15433:5432"
    environment:
      POSTGRES_DB: portal_test
      POSTGRES_USER: portal_test
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-integration-test-password}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portal_test -d portal_test"]
      interval: 3s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:16379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20
