services:
  app:
    ports: []

  bot:
    ports: []

  gateway:
    image: nginx:1.27-alpine
    depends_on:
      app:
        condition: service_healthy
      bot:
        condition: service_healthy
    ports:
      - "${EDGE_PORT:-8080}:8080"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/nginx/conf.d:/etc/nginx/conf.d:ro
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    security_opt:
      - no-new-privileges:true
